<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রহিম ভাই - ১০০ অ্যাড টাস্ক</title>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; background: #eef2f3; padding: 20px; padding-top: 50px; }
        .box { background: white; width: 100%; max-width: 400px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .counter-circle { width: 100px; height: 100px; line-height: 100px; border-radius: 50%; background: #3498db; color: white; font-size: 30px; margin: 20px auto; border: 5px solid #2980b9; }
        .btn-ad { background: #2ecc71; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 50px; cursor: pointer; width: 100%; font-weight: bold; }
        .payment-section { display: none; margin-top: 20px; background: #fff3cd; padding: 15px; border-radius: 10px; border: 1px solid #ffeeba; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        .btn-wa { background: #25D366; color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; }
        .notice { color: #856404; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>রহিম ভাই - ডেইলি ইনকাম</h2>
    <p>১০০টি অ্যাড পূর্ণ করুন এবং ৭০ টাকা বুঝে নিন!</p>
    
    <div class="counter-circle" id="count_display">0</div>
    <p id="status_text">অ্যাড বাকি আছে: <span id="remaining">100</span> টি</p>

    <div id="ad-box" style="margin-bottom: 20px; border: 1px solid #ddd; padding: 10px; background: #fafafa; min-height: 100px;">
        [বিজ্ঞাপন এখানে লোড হবে]
    </div>

    <button id="ad_btn" class="btn-ad" onclick="startAd()">অ্যাড দেখুন</button>

    <div id="payment_ui" class="payment-section">
        <p class="notice">অভিনন্দন! ১০০টি অ্যাড দেখা শেষ।<br>নিচে আপনার বিকাশ নাম্বার দিন। ২৪ ঘণ্টার মধ্যে পেমেন্ট পেয়ে যাবেন।</p>
        <input type="number" id="bkash_number" placeholder="আপনার বিকাশ নাম্বার দিন">
        <button class="btn-wa" onclick="sendToWhatsapp()">✅ হোয়াটসঅ্যাপে মেসেজ পাঠিয়ে টাকা নিন</button>
    </div>
</div>

<script>
    let count = 0;
    let target = 100;
    let adminNumber = "8801619158284"; // আপনার দেওয়া নাম্বার

    function startAd() {
        // এই ফাংশনটি অ্যাড দেখার পর কাজ করবে
        count++;
        
        if (count < target) {
            document.getElementById('count_display').innerText = count;
            document.getElementById('remaining').innerText = target - count;
        } else {
            // ১০০ পূর্ণ হলে
            document.getElementById('count_display').innerText = "১০০";
            document.getElementById('ad_btn').style.display = 'none';
            document.getElementById('status_text').style.display = 'none';
            document.getElementById('payment_ui').style.display = 'block';
        }
    }

    function sendToWhatsapp() {
        let bKash = document.getElementById('bkash_number').value;
        if (bKash.length < 11) {
            alert("দয়া করে সঠিক বিকাশ নাম্বার দিন!");
            return;
        }

        let message = "হ্যালো রহিম ভাই, আমি ১০০টি অ্যাড দেখা শেষ করেছি।\n\nআমার বিকাশ নাম্বার: " + bKash + "\n\nদয়া করে আমাকে ৭০ টাকা পেমেন্ট দিন।";
        let waUrl = "https://wa.me/" + adminNumber + "?text=" + encodeURIComponent(message);
        window.open(waUrl, '_blank');
    }
</script>

</body>
</html>
